name: release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: moon check
        run: moon update && moon version && moon check --target native

      - name: moon test
        run: moon test --target native

      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: Setup credentials
        run: |
          mkdir -p ~/.moon
          echo '${{ secrets.MOON_CREDENTIALS }}' > ~/.moon/credentials.json

      - name: moon publish
        run: moon publish
